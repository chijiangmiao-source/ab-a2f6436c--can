services:
  api:
    build: ./backend
    environment:
      CORS_ORIGINS: ${CORS_ORIGINS:-*}
    ports:
      # Host-side API port, configurable via API_PORT.
      - "${API_PORT:-8000}:8000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2).status==200 else 1)"
      interval: ${HEALTH_INTERVAL:-10s}
      timeout: ${HEALTH_TIMEOUT:-3s}
      retries: ${HEALTH_RETRIES:-5}
      start_period: ${HEALTH_START_PERIOD:-5s}
    restart: unless-stopped

  web:
    build: ./frontend
    ports:
      # Host-side web port, configurable via WEB_PORT.
      - "${WEB_PORT:-8080}:80"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/health"]
      interval: ${HEALTH_INTERVAL:-10s}
      timeout: ${HEALTH_TIMEOUT:-3s}
      retries: ${HEALTH_RETRIES:-5}
      start_period: ${HEALTH_START_PERIOD:-5s}
    restart: unless-stopped

  # Executable acceptance service:
  #   docker compose run --rm verify
  # Waits for healthy stack, exercises HTTP endpoints end-to-end and runs the
  # backend solver/API test suites (including brute-force cross-checks).
  verify:
    build: ./verify
    depends_on:
      api:
        condition: service_healthy
      web:
        condition: service_healthy
    environment:
      API_URL: http://api:8000
      WEB_URL: http://web:80
    volumes:
      - ./backend:/backend:ro
    entrypoint: ["/app/verify.sh"]
